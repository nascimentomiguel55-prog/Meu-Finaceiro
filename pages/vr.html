<div class="page">
  
  <header class="page-header">
    
    <button class="back-btn" onclick="carregarPagina('dashboard')">
      <i data-lucide="arrow-left"></i>
    </button>
    
    <div>
      <h2>Vale Alimentação</h2>
      <p>Saldo, recargas e compras</p>
    </div>
    
  </header>
  
  <section class="form-card">
    
    <h3>Novo Vale Alimentação</h3>
    
    <div class="form-group">
      <label>Nome</label>
      <input type="text" id="nomeVr" placeholder="Ex.: Alelo, VR Sodexo">
    </div>
    
    <div class="form-group">
      <label>Saldo Inicial</label>
      <input type="number" id="saldoInicialVr" placeholder="0,00" step="0.01">
    </div>
    
    <div class="form-group">
      <label>Dia de Recarga</label>
      <input type="number" id="diaRecargaVr" min="1" max="31" placeholder="Ex.: 5">
    </div>
    
    <div class="form-group">
      <label>Valor da Recarga Mensal</label>
      <input type="number" id="valorRecargaVr" placeholder="0,00" step="0.01">
    </div>
    
    <button class="primary-button" onclick="salvarVr()">
      <i data-lucide="plus"></i>
      Adicionar VR
    </button>
    
  </section>
  
  <section class="lista-card">
    
    <h3>Meus Vales</h3>
    
    <div id="listaVr">
      
      <div class="empty">
        <i data-lucide="utensils"></i>
        <p>Nenhum vale cadastrado.</p>
      </div>
      
    </div>
    
  </section>
  
  <section class="form-card">
    
    <h3>Registrar Compra Manual</h3>
    
    <div class="form-group">
      <label>Vale Alimentação</label>
      <select id="vrCompraSelect">
        <option value="">Selecione um vale</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Descrição</label>
      <input type="text" id="descricaoCompraVr" placeholder="Ex.: Almoço">
    </div>
    
    <div class="form-group">
      <label>Valor</label>
      <input type="number" id="valorCompraVr" placeholder="0,00" step="0.01">
    </div>
    
    <div class="form-group">
      <label>Data</label>
      <input type="date" id="dataCompraVr">
    </div>
    
    <button class="primary-button" onclick="registrarCompraVr()">
      <i data-lucide="utensils"></i>
      Registrar Compra
    </button>
    
  </section>
  
  <section class="lista-card">
    
    <h3>Histórico</h3>
    
    <div id="listaHistoricoVr">
      
      <div class="empty">
        <i data-lucide="history"></i>
        <p>Nenhuma movimentação ainda.</p>
      </div>
      
    </div>
    
  </section>
  
</div>
